[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-quality-bench"
version = "0.1.0"
description = "RAG and agent quality evaluation harness for AnythingLLM"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "run_evaluations",
  "run_judge_prototype",
  "run_judge_stability",
  "run_long_form_severity_eval",
  "run_long_form_judge_structured",
  "run_long_form_judge_diagnostic",
  "run_long_form_judge_qwen_16k",
  "judge_stability",
  "judge_debug",
  "claim_level_config",
  "claim_level_debug",
  "claim_level_diagnostics",
  "claim_level_results",
  "fixed_candidate_loader",
  "json_types",
  "long_form_severity_facts",
  "long_form_severity_prompt",
  "workspace_setup",
  "rag_cases",
  "adversarial_cases",
  "conflicting_cases",
  "agent_cases",
  "evaluation_results",
  "evaluation_assertions",
  "judge_results",
  "semantic_judge_specs",
  "yaml_validation",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["clients*", "evaluators*", "judges*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # import sorting
    "B",     # bugbear
    "UP",    # pyupgrade
    "SIM",   # simplifications
    "RUF",   # Ruff-specific checks
    "ANN",   # type annotations
]
ignore = ["SIM110", "SIM108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unreachable = true

disallow_any_explicit = true
disallow_any_expr = true
disallow_any_unimported = true
